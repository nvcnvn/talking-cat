# Rendered by the nginx image's envsubst at start; BACKEND_UPSTREAM defaults in docker-compose.
server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;
    client_max_body_size 20m;

    location /api/ {
        resolver 127.0.0.11 ipv6=off valid=10s;
        set $upstream ${BACKEND_UPSTREAM};
        proxy_pass http://$upstream;  # no URI part: with a variable upstream nginx forwards the original /api/... path
        proxy_http_version 1.1;
        proxy_read_timeout 180s;
        proxy_buffering off;  # /api/talk/stream sends one NDJSON line per sentence; buffering would hold them back
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
